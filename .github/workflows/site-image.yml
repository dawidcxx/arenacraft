# Build and publish the ArenaCraft site image (apps/site) to GHCR.
# The core runtime image lives in image.yml, the lobby API in api-image.yml.
name: site-image

on:
  push:
    branches: [local]
    paths:
      - 'apps/site/**'
      - '.github/workflows/site-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: site-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/dawidcxx/arenacraft-site

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4
        id: buildx

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/local'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: apps/site
          file: apps/site/docker/Dockerfile
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/local' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=site
          cache-to: type=gha,mode=max,scope=site
          provenance: false

  cleanup:
    name: prune old GHCR versions
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/local'
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: arenacraft-site
          package-type: container
          delete-only-untagged-versions: true
          min-versions-to-keep: 0
