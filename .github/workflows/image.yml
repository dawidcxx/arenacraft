# Build and publish the linux/amd64 runtime image on pushes to `local` that
# touch its build inputs, and build it on pull requests to validate against the
# mainline cache (the runtime image is never pushed from a PR, and only `local`
# writes the cache). Only rebuild when something the Dockerfile actually
# consumes changes - API/docs/compose-only commits must not pay for a fat image
# build.
name: image

on:
  push:
    branches: [local]
    paths:
      - 'src/**'
      - 'deps/**'
      - 'zig-build/**'
      - 'build.zig'
      - 'build.zig.zon'
      - 'data/sql/updates/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/image.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'deps/**'
      - 'zig-build/**'
      - 'build.zig'
      - 'build.zig.zon'
      - 'data/sql/updates/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Queue instead of cancel: the Zig cache is only saved at the end of a run, so cancelling a running build whenever a
# newer push lands (several merges an hour) meant no run ever reached "Save Zig cache" and every build started cold
# (~40 min). The running build finishes and saves the cache; GitHub keeps only the newest pending run, which then
# starts warm.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/dawidcxx/arenacraft
  CACHE_IMAGE: ghcr.io/dawidcxx/arenacraft-cache

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4
        id: buildx

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Revision
        id: revision
        run: echo "date=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # `local` = the application built from the `local` branch (the one that runs on the server)
          tags: |
            type=raw,value=local
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      # Zig's cache lives in RUN --mount=type=cache, which BuildKit cannot
      # export through --cache-to/--cache-from. Keep it in a dedicated GHCR
      # package (separate from the published image, so the cleanup job can keep
      # exactly the latest tagged snapshot without touching anything else):
      # pull it into the builder's cache mounts before the build and snapshot
      # the mounts back afterwards. This keeps a fresh commit to "recompile
      # changed files + link".
      - name: Resolve Zig cache image
        id: zigcache
        run: |
          ref="$CACHE_IMAGE:zigcache"
          # The Save step always pushes a plain manifest (provenance/sbom
          # disabled), so the only case to handle is the very first run, before
          # the tag exists.
          if docker buildx imagetools inspect "$ref" >/dev/null 2>&1; then
            echo "image=$ref" >> "$GITHUB_OUTPUT"
          else
            echo "image=docker.io/library/busybox:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Inject Zig cache
        env:
          ZIGCACHE_IMAGE: ${{ steps.zigcache.outputs.image }}
          BUILDER: ${{ steps.buildx.outputs.name }}
        run: |
          ctx="$(mktemp -d)"
          docker buildx build --builder "$BUILDER" --tag arenacraft-zigcache-inject:latest -f - "$ctx" <<EOF
          # syntax=docker/dockerfile:1
          FROM ${ZIGCACHE_IMAGE} AS cache
          RUN mkdir -p /zig-cache /zig-pkg /zig-global
          FROM docker.io/library/busybox:latest
          RUN --mount=type=cache,id=arenacraft-zig-cache,target=/dst --mount=type=bind,from=cache,source=/zig-cache,target=/src cp -a /src/. /dst/
          RUN --mount=type=cache,id=arenacraft-zig-pkg,target=/dst --mount=type=bind,from=cache,source=/zig-pkg,target=/src cp -a /src/. /dst/
          RUN --mount=type=cache,id=arenacraft-zig-global,target=/dst --mount=type=bind,from=cache,source=/zig-global,target=/src cp -a /src/. /dst/
          EOF

      - name: Build
        id: build
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/local' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
            GIT_DATE=${{ steps.revision.outputs.date }}
          # No cross-run layer cache: the builder-stage layers are trivial next
          # to the Zig cache, and a registry cache export is an OCI index, which
          # cannot coexist with untagged-version pruning. Re-add via type=gha if
          # the apt/zig-download layers ever matter.
          provenance: false

      # Push a single manifest (provenance/sbom off) to the dedicated cache
      # package; cleanup keeps only the latest tagged snapshot there.
      # Also after a failed build (e.g. a compile error): everything compiled until then is still worth keeping. Only
      # when the build step actually ran - otherwise the mounts are empty and would overwrite a good cache.
      - name: Save Zig cache
        if: ${{ !cancelled() && github.ref == 'refs/heads/local' && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') }}
        env:
          BUILDER: ${{ steps.buildx.outputs.name }}
        run: |
          ctx="$(mktemp -d)"
          docker buildx build --builder "$BUILDER" -f - "$ctx" --platform linux/amd64 \
            --tag "$CACHE_IMAGE:zigcache" --provenance=false --sbom=false --push <<'EOF'
          # syntax=docker/dockerfile:1
          FROM docker.io/library/busybox:latest
          RUN --mount=type=cache,id=arenacraft-zig-cache,target=/c1 --mount=type=cache,id=arenacraft-zig-pkg,target=/c2 --mount=type=cache,id=arenacraft-zig-global,target=/c3 mkdir -p /zig-cache /zig-pkg /zig-global && cp -a /c1/. /zig-cache/ && cp -a /c2/. /zig-pkg/ && cp -a /c3/. /zig-global/
          EOF

  cleanup:
    name: prune old GHCR versions
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/local'
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: arenacraft
          package-type: container
          delete-only-untagged-versions: true
          min-versions-to-keep: 0
      # The Zig cache image is a plain manifest (no child manifests), so
      # untagged-version pruning keeps the current tagged snapshot and drops
      # older ones. Never point this rule at a registry *cache* export: that is
      # an OCI index whose untagged children are required by the current tag.
      - uses: actions/delete-package-versions@v5
        with:
          package-name: arenacraft-cache
          package-type: container
          delete-only-untagged-versions: true
          min-versions-to-keep: 0
