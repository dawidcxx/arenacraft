# Compile check for every pull request (and for pushes to `local`, which also refresh the build cache).
# Same toolchain as the Dockerfile builder: zig 0.16 + the distro's dev libraries.
name: build

on:
  pull_request:
  push:
    branches: [local]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ac:
    name: zig build ac
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      # mysql.h lives in include/mysql (see Dockerfile)
      CPATH: /usr/include/mysql
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config gcc libssl-dev libhiredis-dev zlib1g-dev libreadline-dev \
            libjemalloc-dev libmysqlclient-dev

      # installs zig and caches its global package cache (boost etc.)
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # The compile cache is ~2 GB: pull requests only restore it, pushes to `local` save a fresh one,
      # so PRs cannot fill the repository's cache quota.
      - name: Restore compile cache
        uses: actions/cache/restore@v4
        with:
          path: .zig-cache
          key: zig-cache-${{ runner.os }}-${{ github.sha }}
          restore-keys: zig-cache-${{ runner.os }}-

      - name: Build
        run: zig build ac

      - name: Save compile cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/local'
        uses: actions/cache/save@v4
        with:
          path: .zig-cache
          key: zig-cache-${{ runner.os }}-${{ github.sha }}
