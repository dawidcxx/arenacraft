# Manual deployment hook for the main arenacraft image. This does not build:
# image.yml publishes ghcr.io/dawidcxx/arenacraft:local on every push to
# `local`. This workflow is the on-demand half - it verifies the image exists
# and runs a placeholder step where the downstream webhook goes (the webhook
# pings a service that pulls the latest image). Only runnable from `local`;
# dispatch from any other ref is skipped.
name: deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to deploy
        required: true
        default: local
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/dawidcxx/arenacraft

jobs:
  deploy:
    if: github.ref == 'refs/heads/local'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Couple the hook to the image pipeline: never fire a deployment for a tag
      # that image.yml has not published.
      - name: Verify image exists
        run: docker buildx imagetools inspect "$IMAGE:${{ inputs.tag }}"

      - name: Trigger downstream deployment
        run: |
          echo "Deployment hook for $IMAGE:${{ inputs.tag }}"
          echo "commit=${{ github.sha }}"
