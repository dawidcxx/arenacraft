# Manual deployment hook for the Discord bot image. This does not build:
# ac-bot-image.yml rebuilds ghcr.io/dawidcxx/arenacraft-bot:latest on every
# apps/ac-bot change. This workflow is the on-demand half - it verifies the
# image exists and runs a placeholder step where the downstream webhook goes.
# Only runnable from `local`; dispatch from any other ref is skipped.
name: ac-bot-deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to deploy
        required: true
        default: latest
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: ac-bot-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/dawidcxx/arenacraft-bot

jobs:
  deploy:
    if: github.ref == 'refs/heads/local'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Couple the hook to the image pipeline: never fire a deployment for a tag
      # that ac-bot-image.yml has not published.
      - name: Verify image exists
        run: docker buildx imagetools inspect "$IMAGE:${{ inputs.tag }}"

      - name: Trigger downstream deployment
        run: |
          echo "Deployment hook for $IMAGE:${{ inputs.tag }}"
          echo "commit=${{ github.sha }}"
