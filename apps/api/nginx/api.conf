# Development reverse proxy. Production only rewrites /api/* onto the service (see README.md);
# auth, caching and request limits live in the API, so this file stays a dumb proxy.
server {
    listen 80 default_server;
    server_name _;

    location = /api {
        return 308 /api/;
    }

    location /api/ {
        proxy_pass http://api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        return 404;
    }
}
