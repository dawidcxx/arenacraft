# nginx in front of ladder-api (mounted as /etc/nginx/conf.d/default.conf, so everything here lives in
# the http {} block). Layers of protection, outermost first:
#   1. per-IP request rate and connection limits        -> floods get 429 before touching the API
#   2. a micro-cache keyed on the path only               -> the API sees ~1 request per 30s, whatever the load
#   3. short client timeouts and tiny buffers             -> slowloris / oversized requests are cut off
# ladder-api itself also caches and only ever runs one database query at a time.

# --- rate limiting -------------------------------------------------------------------------------------
# 2 requests/s per IP with a burst of 20 is plenty for the site (it polls once a minute per open tab).
limit_req_zone  $binary_remote_addr zone=ladder_req:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=ladder_conn:10m;

# --- micro-cache ---------------------------------------------------------------------------------------
proxy_cache_path /var/cache/nginx/ladder levels=1:2 keys_zone=ladder_cache:1m max_size=16m inactive=10m
                 use_temp_path=off;

# If the API is exposed through Cloudflare (proxy or tunnel), trust its client-IP header so the limits
# apply per visitor and not per Cloudflare edge. Ranges: https://www.cloudflare.com/ips/
# set_real_ip_from 173.245.48.0/20;
# ...
# real_ip_header CF-Connecting-IP;

upstream ladder_api {
    server ladder-api:8080;
    keepalive 8;
}

server {
    listen 80 default_server;
    server_name _;

    server_tokens off;

    # GET-only API: no bodies, small headers, short timeouts.
    client_max_body_size 1k;
    client_body_buffer_size 1k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    client_body_timeout 5s;
    client_header_timeout 5s;
    send_timeout 10s;
    keepalive_timeout 15s;
    keepalive_requests 100;

    limit_req zone=ladder_req burst=20 nodelay;
    limit_req_status 429;
    limit_conn ladder_conn 10;
    limit_conn_status 429;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 2s;
    proxy_send_timeout 5s;
    proxy_read_timeout 5s;

    location = /ladder/soloq {
        # GET also allows HEAD; OPTIONS stays allowed for CORS preflights.
        limit_except GET OPTIONS {
            deny all;
        }

        proxy_pass http://ladder_api;

        # One cache entry per path: query strings cannot be used to bust the cache.
        proxy_cache ladder_cache;
        proxy_cache_key "$request_method /ladder/soloq";
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 30s;
        # only one request refreshes an expired entry, the rest wait or get the stale copy
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_background_update on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location = /health {
        limit_except GET {
            deny all;
        }
        access_log off;
        proxy_pass http://ladder_api;
    }

    location / {
        return 404;
    }
}
