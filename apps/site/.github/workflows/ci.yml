name: CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, format, typecheck & test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Install dependencies
        run: nix develop --command bun install --frozen-lockfile

      - name: Build common
        run: nix develop --command bun run build:common

      - name: Check formatting
        run: nix develop --command format-check

      - name: Lint
        run: nix develop --command lint

      - name: Typecheck
        run: nix develop --command bun run typecheck

      - name: Test
        run: nix develop --command bun run test