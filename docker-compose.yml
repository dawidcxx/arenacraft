services:
  db:
    image: docker.io/library/mysql:8.0
    # mysql_native_password is still available in 8.0; the flag is removed in 8.4+
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: acore
      MYSQL_USER: acore
      MYSQL_PASSWORD: acore
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - 3306:3306
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pacore", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s

  valkey:
    # official valkey image (docker.io/bitnami images were frozen in sep 2025;
    # ALLOW_EMPTY_PASSWORD was bitnami-only and is not needed here)
    image: docker.io/valkey/valkey:8.0
    ports:
      - '6379:6379'
    volumes:
      - 'valkey_data:/data'
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis-insight:
    image: docker.io/redis/redisinsight:latest
    restart: always
    ports:
      - "5540:5540"
    volumes:
      - redis-insight:/data

  adminer:
    image: docker.io/library/adminer:latest
    restart: always
    ports:
      - 6664:8080

  # --- full profile: runs the core against db/valkey with ./data mounted ---
  # one-shot: applies data/sql into the databases (idempotent, always attempted)
  # db_sync is pure bun/typescript: no cpp involved, so it runs in the bun
  # image directly instead of the core image
  db-migrate:
    profiles: [full]
    image: docker.io/oven/bun:1
    working_dir: /app
    command: >-
      sh -c 'bun install --production --frozen-lockfile --cwd scripts
      && bun scripts/src/db_sync.ts'
    environment:
      AC_ROOT_DATABASE_INFO: "db;3306;root;acore"
      AC_LOGIN_DATABASE_INFO: "db;3306;acore;acore;acore_auth"
      AC_CHARACTER_DATABASE_INFO: "db;3306;acore;acore;acore_characters"
      AC_WORLD_DATABASE_INFO: "db;3306;acore;acore;acore_world"
    volumes:
      - ./scripts:/app/scripts
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  auth:
    profiles: [full]
    build: { context: ., dockerfile: Dockerfile }
    image: arenacraft:local
    command: [ac, authserver]
    restart: unless-stopped
    environment:
      AC_LOGIN_DATABASE_INFO: "db;3306;acore;acore;acore_auth"
      AC_REDIS_HOST: valkey
      AC_CRASH_DIR: /app/crashes
    ports:
      - 3724:3724
    volumes:
      - ./crashes:/app/crashes
    stdin_open: true
    tty: true
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

  # RA is the built-in remote console (same commands as the local one):
  #   nc localhost 3443  ->  account with account_access.gmlevel >= 3, RealmID = -1
  # kept on localhost because the protocol is plaintext
  world:
    profiles: [full]
    image: arenacraft:local
    command: [ac, worldserver]
    restart: unless-stopped
    environment:
      AC_LOGIN_DATABASE_INFO: "db;3306;acore;acore;acore_auth"
      AC_CHARACTER_DATABASE_INFO: "db;3306;acore;acore;acore_characters"
      AC_WORLD_DATABASE_INFO: "db;3306;acore;acore;acore_world"
      AC_REDIS_HOST: valkey
      AC_REALMID: 1
      AC_DATA_DIR: /app/data
      AC_RA_ENABLE: "true"
      AC_CRASH_DIR: /app/crashes
    volumes:
      - ./data:/app/data
      - ./crashes:/app/crashes
    ports:
      - 8085:8085
      - "127.0.0.1:3443:3443"
    stdin_open: true
    tty: true
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

volumes:
  mysql-data:
  redis-insight:
  valkey_data:
